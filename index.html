<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons - Optimized with multiple formats for compatibility -->
    <link rel="icon" href="/gei-logo.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="/GEI_Envirohealth_Icon[1].png"
      type="image/png"
      sizes="32x32"
    />
    <link
      rel="apple-touch-icon"
      href="/GEI_Envirohealth_Icon[1].png"
      sizes="180x180"
    />
    <link
      rel="shortcut icon"
      href="/GEI_Envirohealth_Icon[1].png"
      type="image/png"
    />

    <!-- Preload favicon for performance -->
    <link rel="preload" href="/gei-logo.svg" as="image" type="image/svg+xml" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Global Envirohealth Initiative - Advancing sustainable solutions for a healthier planet through research, advocacy, and community engagement."
    />
    <meta
      name="keywords"
      content="gei, envirohealth, environmental health, sustainability, climate action, conservation, health systems"
    />
    <meta name="theme-color" content="#0089ef" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://geiglobal.org" />
    <meta property="og:title" content="Global Envirohealth Initiative - GEI" />
    <meta
      property="og:description"
      content="Advancing sustainable solutions for a healthier planet"
    />
    <meta property="og:image" content="/GEI_Envirohealth_Icon[1].png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://geiglobal.org" />
    <meta name="twitter:title" content="Global Envirohealth Initiative - GEI" />
    <meta
      name="twitter:description"
      content="Advancing sustainable solutions for a healthier planet"
    />
    <meta name="twitter:image" content="/GEI_Envirohealth_Icon[1].png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://geiglobal.org" />

    <title>
      Global Envirohealth Initiative - GEI | Sustainable Health Solutions
    </title>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      .font-playfair {
        font-family: "Playfair Display", serif !important;
      }
      .font-inter {
        font-family: "Inter", sans-serif !important;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes pulse-scale {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideInLeft {
        from {
          opacity: 0;
          transform: translateX(-30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes slideInRight {
        from {
          opacity: 0;
          transform: translateX(30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .motion-float,
        .motion-pulse,
        .animate-fadeInUp,
        .animate-slideInLeft,
        .animate-slideInRight {
          animation: none !important;
          transform: none !important;
        }
      }

      .motion-float {
        animation: float 6s ease-in-out infinite;
      }
      .motion-pulse {
        animation: pulse-scale 4s ease-in-out infinite;
      }
      .animate-fadeInUp {
        animation: fadeInUp 0.8s ease-out forwards;
      }
      .animate-slideInLeft {
        animation: slideInLeft 0.8s ease-out forwards;
      }
      .animate-slideInRight {
        animation: slideInRight 0.8s ease-out forwards;
      }

      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.8s ease-out;
      }

      .reveal.revealed {
        opacity: 1;
        transform: translateY(0);
      }

      .glass-effect {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .hover-lift {
        transition: all 0.3s ease;
      }

      .hover-lift:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body class="font-inter">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Global Envirohealth Initiative",
        "alternateName": "GEI",
        "url": "https://geiglobal.org",
        "logo": {
          "@type": "ImageObject",
          "url": "https://geiglobal.org/gei-logo.svg",
          "width": 154,
          "height": 154
        },
        "image": "https://geiglobal.org/gei-logo.svg",
        "description": "Global Envirohealth Initiative strengthens rural health systems by upgrading facilities, equipping providers, and introducing breakthrough tools like non-invasive anemia screening.",
        "sameAs": [
          "https://twitter.com/GEI",
          "https://facebook.com/GlobalEnvirohealthInitiative",
          "https://linkedin.com/company/global-envirohealth-initiative"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "Customer Service",
          "email": "info@geiglobal.org"
        }
      }
    </script>
  </body>
</html>
